<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Transaction</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="card">

        <div class="card-body">

            <h2>Edit Transaction</h2>

            <form method="POST">

                <div class="mb-3">
                    <label>Title</label>
                    <input
                        type="text"
                        name="title"
                        class="form-control"
                        value="{{ transaction.title }}"
                        required>
                </div>

                <div class="mb-3">
                    <label>Amount</label>
                    <input
                        type="number"
                        step="0.01"
                        name="amount"
                        class="form-control"
                        value="{{ transaction.amount }}"
                        required>
                </div>

                <div class="mb-3">

                    <label>Type</label>

                    <select
                        name="type"
                        class="form-select">

                        <option value="Income"
                        {% if transaction.type == 'Income' %}
                        selected
                        {% endif %}>
                        Income
                        </option>

                        <option value="Expense"
                        {% if transaction.type == 'Expense' %}
                        selected
                        {% endif %}>
                        Expense
                        </option>

                    </select>

                </div>

                <button
                    type="submit"
                    class="btn btn-success">
                    Update Transaction
                </button>

                <a href="/"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
