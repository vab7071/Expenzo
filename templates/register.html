<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Expenzo</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link 
        rel="stylesheet"
        href="{{ url_for('static', filename='css/auth.css') }}">
</head>

<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <!-- Branding -->
            <div class="text-center mb-4">

                <h1 class="brand">
                    💰 Expenzo
                </h1>

                <p class="tagline">
                    Track Every Rupee. Smartly.
                </p>

            </div>

            <!-- Register Card -->
            <div class="card login-card">

                <div class="card-header">

                    <h3 class="mb-0">
                        Create Account
                    </h3>

                </div>

                <div class="card-body p-4">

                    <form action="/register" method="POST">

                        <!-- Email -->
                        <div class="mb-3">

                            <label class="form-label">
                                Email Address
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter your email"
                                required>

                        </div>

                        <!-- Password -->
                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Create password"
                                required>

                        </div>

                        <!-- Confirm Password -->
                        <div class="mb-3">

                            <label class="form-label">
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                name="confirm_password"
                                class="form-control"
                                placeholder="Confirm password"
                                required>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-login">

                            Register

                        </button>

                    </form>

                    <div class="text-center mt-4">

                        Already have an account?

                        <a href="/login">
                            Login
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
